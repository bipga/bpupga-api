name: Runtime package and GPU image
on:
  push:
    branches: [main]
    paths: ['runtime/**', '.github/workflows/runtime-release.yml']
  workflow_dispatch:
    inputs:
      publish_target:
        description: Python registry (requires a configured trusted publisher)
        type: choice
        options: [none, testpypi, pypi]
        default: none
permissions:
  contents: read
concurrency:
  group: runtime-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build runtime --outdir dist
          python -m twine check dist/*
      - name: Install wheel in the runner environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --find-links dist -c runtime/requirements-lock.txt 'bipga[all]==0.1.0'
      - name: Test the installed distribution outside its source directory
        working-directory: /tmp
        run: |
          bipga doctor --all
          python -m unittest discover -s "$GITHUB_WORKSPACE/runtime/tests" -v
          bipga demo --method all --device cpu --output /tmp/bipga-demo
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
  container:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Make room for CUDA development dependencies
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runtime
          file: runtime/docker/Dockerfile
          push: true
          tags: ghcr.io/bipga/bipga:0.1.0,ghcr.io/bipga/bipga:latest
          labels: |
            org.opencontainers.image.source=https://github.com/bipga/bpupga-api
            org.opencontainers.image.title=BiPGA
            org.opencontainers.image.version=0.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the published image
        run: |
          docker run --rm ghcr.io/bipga/bipga:0.1.0 --version
          docker run --rm ghcr.io/bipga/bipga:0.1.0 doctor --all
  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    needs: package
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi'
    needs: package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bipga"
version = "0.1.0"
description = "Twelve graph alignment methods with construction, evaluation, diagnostics and reproducible paper results"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Component-Terms"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "BiPGA"}]
dependencies = ["numpy>=1.26,<3", "networkx>=3.2,<4", "scipy>=1.12,<2", "scikit-learn>=1.4,<2"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4"]
all = ["torch==2.10.0", "torch-geometric==2.7.0", "dgl==1.1.3", "gensim==4.4.0", "pandas>=2.2,<3", "matplotlib>=3.8,<4", "psutil>=6,<8", "PyYAML>=6,<7", "tqdm>=4.66,<5", "POT==0.9.6.post1"]

[project.scripts]
bipga = "bpupga.cli:main"

[project.urls]
Documentation = "https://bipga.github.io/"
Source = "https://github.com/bipga/bpupga-api"
Artifacts = "https://bipga.github.io/supplementary/"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bpupga", "bipga"]
include-package-data = true

[tool.setuptools.package-data]
bpupga = ["_engine/**/*", "examples/**/*"]
